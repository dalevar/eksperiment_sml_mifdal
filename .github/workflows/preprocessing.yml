name: Preprocessing Automation

on:
  push:
    paths:
      - "preprocessing/**"
      - "namadataset_raw/**"
  workflow_dispatch:

jobs:
  preprocess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install kaggle pandas numpy scikit-learn
      - name: Run preprocessing automation
        run: |
          python preprocessing/automate_mifdal.py
      - name: Upload processed dataset
        uses: actions/upload-artifact@v4
        with:
          name: heart_disease_preprocessed
          path: preprocessing/heart_disease_preprocessed/
