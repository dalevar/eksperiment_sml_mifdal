name: CI/CD MLflow Heart Disease

on:
  push:
    branches:
      - workflow-ci
  pull_request:
    branches:
      - workflow-ci
  workflow_dispatch:

env:
  TRAIN_PATH: "MLProject/heart_disease_preprocessed/train_data.csv"
  TEST_PATH: "MLProject/heart_disease_preprocessed/test_data.csv"
  TARGET_VAR: "Heart Disease"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow scikit-learn pandas numpy matplotlib

      - name: Run MLflow Project
        run: |
          cd workflow-CI && mlflow run MLProject --env-manager=local -P train_data=heart_disease_preprocessed/train_data.csv -P test_data=heart_disease_preprocessed/test_data.csv

      - name: Debug list mlruns
        run: |
          cd workflow-CI
          echo "==== List mlruns/0 ===="
          ls -l mlruns/0 || echo "mlruns/0 not found"
          echo "==== List mlruns/0/*/artifacts ===="
          for d in mlruns/0/*; do
            if [ -d "$d/artifacts" ]; then
              echo "$d/artifacts:"
              ls -l "$d/artifacts"
            fi
          done

      - name: Get latest MLflow run_id
        run: |
          cd workflow-CI
          RUN_ID=$(ls -td mlruns/0/*/ | head -n 1 | cut -d'/' -f3)
          if [ -z "$RUN_ID" ]; then
            echo "No MLflow run found!"
            exit 1
          fi
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Latest run_id: $RUN_ID"

      - name: Build Docker Model
        run: |
          cd workflow-CI
          mlflow models build-docker --model-uri "runs:/$RUN_ID/model" --name "heart-disease-ml"

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag heart-disease-ml ${{ secrets.DOCKER_HUB_USERNAME }}/heart-disease-ml:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/heart-disease-ml:latest
